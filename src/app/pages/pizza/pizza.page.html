@if (pizza.isLoading()) {
  <p>Chargement...</p>
} @else if (pizza.error()) {
  <p>Cette pizza n'existe pas.</p>
} @else if (pizza.value(); as pizza) {
  <h2 class="text-2xl font-bold text-orange-600">{{ pizza.name }}</h2>
  <div><span class="font-medium">prix :</span> {{ pizza.price }} €</div>
  <img class="my-4 rounded-lg" [src]="pizza.image" [alt]="pizza.name" />
  <a routerLink="/pizza/4">Pizza Suivante</a>
}
